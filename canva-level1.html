<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Irene 老师 Canva Level 1 课程">
  <title>Canva Level 1｜Irene 老师</title>
  <link rel="stylesheet" href="style.css?v=20260930-1">
  <script src="data.js?v=20260930-7" defer></script>
  <script src="script.js?v=20260930-1" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要内容</a>
  <header class="site-header">
    <div class="site-header__inner container">
      <a class="site-name" href="index.html">Irene 老师 Workshop</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="打开联系菜单" data-menu-toggle>
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav class="contact-menu" id="site-menu" aria-label="联系方式" data-contact-menu hidden>
        <a href="#" data-contact="whatsapp">WhatsApp</a>
        <a href="#" data-contact="facebook">Facebook</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-main container" data-canva-course-detail>
    <section class="canva-detail-hero">
      <div class="canva-detail-hero__content">
        <p class="canva-detail__level" data-canva-level></p>
        <h1 data-canva-title></h1>
        <p class="canva-detail__status" data-canva-status></p>
        <p class="canva-detail__intro" data-canva-intro></p>
      </div>
      <div class="canva-detail__poster" data-canva-poster></div>
    </section>

    <section class="canva-detail-section">
      <h2>重点资料卡</h2>
      <dl class="canva-info-grid" data-canva-info></dl>
    </section>

    <section class="canva-detail-section">
      <h2>课程内容</h2>
      <div class="canva-outline-card" data-canva-outline></div>
      <ul class="canva-module-list" data-canva-modules></ul>
    </section>

    <section class="canva-detail-section">
      <h2>学生作品</h2>
      <div class="canva-works-grid" data-canva-works></div>
      <p class="canva-empty-note" data-canva-works-empty>学生作品将陆续放上来。</p>
    </section>

    <section class="canva-detail-section">
      <h2>FAQ</h2>
      <div class="canva-faq-list" data-canva-faqs></div>
    </section>

    <section class="canva-contact-cta">
      <h2>想了解这门课适不适合孩子？</h2>
      <a class="button button--primary" href="#" data-contact="whatsapp">WhatsApp 联系 Irene 老师</a>
    </section>
  </main>

  <a class="floating-whatsapp" href="#" data-contact="whatsapp" aria-label="WhatsApp 联系 Irene 老师">WhatsApp</a>
  <footer class="site-footer" aria-label="页尾"><div class="site-footer__inner container" data-footer></div></footer>

</html>
