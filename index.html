<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Irene 老师 Workshop 网站">
  <title>Irene 老师 Workshop</title>
  <link rel="stylesheet" href="style.css?v=20260904-4">
  <script src="data.js?v=20260905-2" defer></script>
  <script src="registration.js?v=20260904-4" defer></script>
  <script src="script.js?v=20260905-2" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要内容</a>

  <header class="site-header">
    <div class="site-header__inner container">
      <a class="site-name" href="index.html" aria-label="Irene 老师 Workshop 首页">
        Irene 老师 Workshop
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-menu"
        aria-label="打开联系菜单"
        data-menu-toggle
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <nav class="contact-menu" id="site-menu" aria-label="联系方式" data-contact-menu hidden>
        <a href="#" data-contact="whatsapp">WhatsApp</a>
        <a href="#" data-contact="facebook">Facebook</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="site-main container">
    <h1 class="visually-hidden">Irene 老师 Workshop</h1>

    <section class="hero" data-section="hero">
      <div class="hero__media" data-hero-media></div>

      <div class="hero__content">
        <p class="hero__eyebrow" data-hero-eyebrow></p>
        <p class="hero__statement" data-hero-statement></p>

        <div class="hero__actions" data-hero-actions></div>
      </div>
    </section>

    <section class="section current-workshop" id="latest-workshop" data-section="current-workshop" hidden>
      <h2 class="section__title">最新 Workshop</h2>
      <div data-current-workshop></div>
    </section>

    <section class="section testimonials" data-section="testimonials" hidden>
      <h2 class="section__title">学员反馈</h2>
      <div class="testimonial-slider" data-testimonials></div>
    </section>

    <section class="section past-workshops" id="past-workshops" data-section="past-workshops" hidden>
      <h2 class="section__title">往期 Workshop</h2>
      <div class="workshop-slider" data-past-workshop-slider></div>
    </section>

    <section class="section school-workshops" data-section="school-workshops" hidden>
      <h2 class="section__title">School Workshop｜校内教师培训</h2>
      <div data-school-workshops></div>
    </section>
  </main>

  <footer class="site-footer" aria-label="页尾">
    <div class="site-footer__inner container" data-footer></div>
  </footer>
</body>
</html>
