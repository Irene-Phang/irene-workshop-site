<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Irene 老师 Workshop 详情与报名">
  <title>Workshop 详情｜Irene 老师</title>
  <link rel="stylesheet" href="style.css?v=20260904-4">
  <script src="data.js?v=20260904-4" defer></script>
  <script src="registration.js?v=20260904-4" defer></script>
  <script src="script.js?v=20260904-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要内容</a>

  <header class="site-header">
    <div class="container">
      <a class="back-link" href="index.html">← 返回主页</a>
    </div>
  </header>

  <main id="main-content" class="site-main workshop-page container">
    <article data-workshop-detail>
      <header class="workshop-intro">
        <div class="workshop-intro__poster" data-detail-poster></div>
        <div class="workshop-intro__content">
          <p class="workshop-intro__label" data-detail-label></p>
          <h1 data-detail-title></h1>
          <p class="workshop-intro__subtitle" data-detail-subtitle></p>
          <p class="workshop-intro__claim" data-detail-claim></p>
          <dl class="workshop-meta">
            <div>
              <dt>日期</dt>
              <dd data-detail-date></dd>
            </div>
            <div>
              <dt>时间</dt>
              <dd data-detail-time></dd>
            </div>
            <div>
              <dt>形式</dt>
              <dd data-detail-mode></dd>
            </div>
            <div>
              <dt>时长</dt>
              <dd data-detail-duration></dd>
            </div>
          </dl>
          <div data-detail-pricing></div>
          <a class="button button--primary workshop-intro__action" href="#registration-form" data-detail-action>立即报名</a>
        </div>
      </header>

      <section class="detail-section">
        <h2 data-detail-pain-title></h2>
        <ul class="detail-list" data-detail-pain-points></ul>
      </section>

      <section class="detail-section">
        <h2 data-detail-description-title></h2>
        <p data-detail-description></p>
      </section>

      <section class="detail-section">
        <h2 data-detail-outcomes-title></h2>
        <ul class="detail-list" data-detail-outcomes></ul>
        <p class="detail-note" data-detail-outcome-note hidden></p>
      </section>

      <section class="detail-section">
        <h2 data-detail-audience-title></h2>
        <ul class="detail-list" data-detail-audience></ul>
        <p class="detail-note" data-detail-audience-note hidden></p>
      </section>

      <section class="detail-section" data-detail-testimonials-section>
        <h2>学员反馈</h2>
        <div class="detail-testimonials" data-detail-testimonials></div>
      </section>

      <section class="detail-section" data-detail-faq-section>
        <h2>常见问题</h2>
        <div class="faq-list" data-detail-faqs></div>
      </section>

      <section class="registration-closed" data-registration-closed hidden>
        <h2>即将开课</h2>
        <p>报名尚未开放，确认课程资料后会在这里开放报名。</p>
      </section>

      <section class="registration-section" id="registration-form" data-registration-section hidden>
        <div class="registration-section__intro">
          <h2 data-detail-cta-title></h2>
          <p data-detail-cta-support></p>
        </div>

        <form class="registration-form" data-registration-form novalidate>
          <div class="form-field">
            <label for="participant-name">姓名 <span aria-hidden="true">*</span></label>
            <input id="participant-name" name="name" type="text" autocomplete="name" required>
            <p class="field-reminder" data-name-reminder></p>
            <p class="field-note" data-name-note></p>
          </div>

          <div class="form-field">
            <label for="participant-whatsapp">WhatsApp <span aria-hidden="true">*</span></label>
            <input id="participant-whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required>
          </div>

          <div class="form-field">
            <label for="participant-teaching">任教科目及年级 <span class="optional">选填</span></label>
            <input id="participant-teaching" name="teaching" type="text">
          </div>

          <section class="payment-panel" aria-labelledby="payment-title">
            <h3 id="payment-title">付款资料</h3>
            <div data-payment-pricing></div>
            <div class="qr-placeholder" data-payment-qr role="img" aria-label="DuitNow QR 待更新">DuitNow QR</div>
            <p><strong>收款人：</strong><span data-payment-recipient></span></p>
            <p class="field-note" data-payment-note></p>
          </section>

          <div class="form-field">
            <label for="payment-proof">付款证明 <span aria-hidden="true">*</span></label>
            <label class="file-select-label" for="payment-proof" data-file-label>选择付款证明</label>
            <input class="visually-hidden" id="payment-proof" name="paymentProof" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf" data-proof-input>
            <div class="file-status" data-file-status hidden>
              <span data-proof-name></span>
              <button class="text-button" type="button" data-remove-proof>删除</button>
            </div>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="company-website">Website</label>
            <input id="company-website" name="companyWebsite" type="text" tabindex="-1" autocomplete="off">
          </div>

          <iframe class="registration-response-frame" name="registration-response" data-registration-response-frame title="报名提交结果" hidden></iframe>

          <button class="button button--primary submit-button" type="submit">提交报名</button>
          <div class="form-message" role="status" aria-live="polite" data-form-message></div>
        </form>

        <p class="registration-contact">资料有误？<a href="#" data-contact="whatsapp">WhatsApp 联系 Irene</a></p>
      </section>
    </article>
  </main>

  <footer class="site-footer" aria-label="页尾">
    <div class="site-footer__inner container" data-footer></div>
  </footer>
</body>
</html>
